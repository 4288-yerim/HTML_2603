<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body{
            background-color: #eee;
        }
        #container{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box{
            width: 350px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 1px 1px 12px rgb(194, 194, 194);
        }
        .welcome{
            text-align: center;
            margin-bottom: 10px;
        }
        .sev{
            text-align: center;
            color: #999;
            margin-bottom: 40px;
            font-size: 15px;
        }
        .id, .password{
            font-size: 14px;
            margin-top: 15px;
        }

        .text-box{
            margin: 5px 0px;
            width: 93%;
            height: 25px;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            outline: none;
        }

        .text-box2{
            margin: 5px 0px;
            margin-right: 8px;
            width: 67%;
            height: 25px;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            outline: none;
        }

        .text-box:focus {
            border-color: #4A90E2;
        }

        .text-box2:focus {
            border-color: #4A90E2;
        }

        .blue-box{
            width: 100%;
            padding: 15px;
            background-color: #4A90E2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 15px 0px;
        }

        .bottom-text{
            margin-bottom: 20px;
            text-align: center;
            color: #999;
            font-size: 12px;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
        }
        
        .check {
            border: 2px solid #eee;
            background-color: #4A90E2;
            color: white;
            padding: 14px 12px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="container">
            <div id="box">
                <h2 class="welcome">회원가입</h2>
                <div class="sev">새로운 계정을 만들어 서비스를 시작하세요.</div>

                <div class="id">이름</div>
                <div><input placeholder="홍길동" class="text-box"> </div>

                <div class="id">아이디</div>
                <span><input type="text" v-model="userId" placeholder="아이디를 입력해주세요." class="text-box2"></span>
                <button @click="fnCheck">중복체크</button>

                <div class="password">비밀번호</div>
                <div><input type="password" placeholder="8자 이상 입력" class="text-box"></div>

                <div class="password">비밀번호 확인</div>
                <div><input type="password" placeholder="비밀번호를 다시 입력하세요" class="text-box"></div>

                <button class="blue-box">가입하기</button>
                
                <div class="bottom-text">
                    <div>이미 계정이 있으신가요?</div>
                    <a href="#">로그인</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                userId : "",
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnCheck : function () {
                let self = this;
                let param = {
                    userId : self.userId
                }
                $.ajax({
                    url: "http://192.168.30.57:3009/id-cheak",
                    dataType: "json",
                    type: "GET",
                    data : param,
                    // data: {userId : self.userId, pwd : self.pwd},
                    success: function (data) {
                        console.log(data);
                        // alert(data.message);
                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
