<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>색</title>
    <style>
        #container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            /* grid-template-rows: 100px 200px; */
            grid-auto-rows: 100px;
        }
        .box{
            border: 1px solid black;
            padding: 5px 10px;
            text-align: center;
            font-size: 15px;
        }
        .box:nth-child(1){
            background-color: #07111a;
            color: white;
        }
        .box:nth-child(2){
            background-color: rgba(10, 22, 33, 0.75);
            color: white;
        }
        .box:nth-child(3){
            background-color: #1fd6ff;
        }
        .box:nth-child(4){
            background-color: #78a9ff;
        }
        .box:nth-child(5){
            background-color: #b388ff;
        }
        .box:nth-child(6){
            background-color: #d8f6ff;
        }
        .box:nth-child(7){
            background-color: #7ea8b7;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="box">배경</div>
        <div class="box">패널</div>
        <div class="box">라인</div>
        <div class="box">보조 라인</div>
        <div class="box">포인트</div>
        <div class="box">텍스트</div>
        <div class="box">약한 텍스트</div>
    </div>
        <!-- 배경: #07111a
        패널: rgba(10, 22, 33, 0.75)
        라인: #1fd6ff
        보조 라인: #78a9ff
        포인트: #b388ff
        텍스트: #d8f6ff
        약한 텍스트: #7ea8b7 -->
</body>
</html>
