<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: rgb(238, 248, 253);
        }
        #container {
            width: 800px;
            margin: 100px auto;
        }
        .border-box{
            width: 317px;
            height: 441px;
            border: 2px dashed #ccc;
            perspective: 600px;
        }
        .box-parent{
            width: 100%;
            height: 100%;
            background-image: url(../media/poket1.png);
            background-size: cover;
            position: relative;
            /* animation: rotateParent 4s linear infinite; */

            /* transform-style: flat; 디폴트 */
            transform-style: preserve-3d;
        }
        .box-child{
            width: 100%;
            height: 100%;
            position: absolute;
            background-image: url(../media/poket2.png);
            background-size: cover;
            /* left : 60px;
            top: 60px; */
            /* transform: translateZ(50px); */
            backface-visibility: hidden;
        }
        @keyframes rotateParent {
            0%{transform : rotateY(0deg);}
            100%{transform: rotateY(360deg);}
        }
        .perspective3 .box-parent{
            transition: transform 1s ease;
        }
        .perspective3:hover .box-parent {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="border-box perspective3">
            <div class="box-parent">
                <div class="box-child"></div>
            </div>
        </div>
    </div>
</body>
</html>
