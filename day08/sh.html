
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid 실습 완성본</title>
  <style>
    body {
        margin: 0;
        padding: 20px;
        background-color: #f0f2f5;
        color: #333;
    }

    .box {
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px #eee;
        font-weight: bold;
        font-size: 20px;
    }

    .header {
        background-color: #e3ecf2;
        color: black;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .header-img {
        width: 200px;
        height: 100px;
        border-radius: 30px;
        box-shadow: 3px 3px 3px #888;
        background-image: url("../media/logo.png");
        background-size: contain;
    }

    .side {
        background-color: #fafafa;
        color: #333;
        padding: 30px 20px;
    }

    .content {
        background-color: #fafafa;
        box-shadow: none;
        padding: 20px;
    }

    .widget {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px #eee;
        align-items: center;
    }

    .footer {
        background-color: #fafafa;
        color: white;
    }

    .dashboard-container {
        display: grid;
        gap: 20px;
        grid-template-columns: 300px 1fr;
        grid-template-rows: 150px minmax(1000px, auto) 150px;
        grid-template-areas:
        "header header"
        "side content"
        "footer footer";
    }

    .header { grid-area: header; }
    .side { grid-area: side; }
    .content { grid-area: content; }
    .footer { grid-area: footer; }

    .content {
        display: grid;
        gap: 20px; 
        grid-template-columns: repeat(auto-fit, minmax(260px, 260px));
        grid-auto-rows: 300px;
        
    }

    @media (max-width: 768px) {
        .dashboard-container {
            grid-template-columns: 1fr;
            grid-template-rows: 150px 150px 1fr 150px;
            grid-template-areas:
            "header"
            "side"
            "content"
            "footer";
        }
    }

    .word {
        margin-top : 20px;
        font-size: 15px;
    }

    .red {
        color: red;
        font-size: 15px;
        margin-top : 5px;
    }

    .widget-img1 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url("../media/java.jpg");
        background-size: contain;
    }
    .widget-img2 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url("../media/oracle.jpg");
        background-size: contain;
    }
    .widget-img3 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url("../media/html.jpg");
        background-size: contain;
    }
    .widget-img4 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url("../media/jquery.jpg");
        background-size: contain;
    }
    .widget-img5 {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background-image: url("../media/java_img.jpg");
        background-size: contain;
    }
    .htext{
        margin: 8px 0px;
    }
    .menu{
        font-size: 13px;
        border: none;
        width: 90%;
        height: 30px;
        padding: 0px 10px;
        list-style: none;
    }

    .menu a{
        text-decoration: none;
        color: #555555;
        display: block;
        border-radius: 6px;
        margin-bottom: 10px;
        padding: 10px 15px;
    }
    .menu a:hover,
    .menu a.active{
        background-color: #4ecdc4; 
        color: white;
        font-weight: bold;
    }
    .button{
        border: none;
        background-color: #e3ecf2;
        font-size: 20px;
    }
    .rjatordj{
        border: none;
        padding: 10px;
        width: 400px;
    }
  </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="box header">
            <p class="header-img"></p>
            
            <div class="rjatordj">
                <input type="text" placeholder="검색어를 입력하세요.">
                <button>검색</button>
            </div>
            
            <div>
                <button class="button">🔔</button>
                <button class="button">👨‍💻</button>
                <span>홍길동</span>
            </div>
            
        </div>

        <div class="box side">
            <h5 class="htext">카테고리</h5>
            <ul class="menu">
                <li><a href="#" class="active">전체 상품</a></li>
                <li><a href="#">스마트폰</a></li>
                <li><a href="#">게임기</a></li>
                <li><a href="#">노트북</a></li>
                <li><a href="#">기타</a></li>
            </ul>
        </div>

        <div class="box content">
        <div class="widget">
            <div class="widget-img1"></div>
            <div class="word">갤럭시 S24</div>
            <div class="red">15,900원</div>
        </div>
        <div class="widget">
            <div class="widget-img2"></div>
            <div class="word">아이폰 15</div>
            <div class="red">39,000원</div>
        </div>
        <div class="widget">
            <div class="widget-img3"></div>
            <div class="word">LG OLED TV</div>
            <div class="red">28,500원</div>
        </div>
        <div class="widget">
            <div class="widget-img4"></div>
            <div class="word">맥북 에어 M3</div>
            <div class="red">45,000원</div>
        </div>
        <div class="widget">
            <div class="widget-img5"></div>
            <div class="word">갤럭시 북4</div>
            <div class="red">19,000원</div>
        </div>
        </div>

        <div class="box footer">하단 영역~~</div>
    </div>
</body>
</html>
