<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 850px;
            margin: 20px auto;
        }
        .title{
             text-align: center;
             font-size: 30px;
             font-weight: bold;
        }
        .box{
            width: 500px;
            height: 700px;
            border: 1px solid silver;
            margin: 0 auto;
            margin-top: 20px;
            box-shadow: 1px 1px silver;
        }
        .sred{
            color: red;
            margin: 20px;
        }
        .red{
            color: red;
            font-weight: bold;
            margin: 20px 0px 20px 20px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="title">지원 양식</div>
        <div class="box">
            <div class="sred">* 빨간색은 필수 입력입니다.</div>
            <div class="red">
                <label>이 름 : <input type="text"></label>
            </div>
            <div style="margin: 20px;">
                <label>학 과 : <input type="text"></label>
            </div>
            <div>
                <label><span class="red">연락처 : </span>
                    <select>
                        <option>010</option>
                        <option>02</option>
                        <option>032</option>
                        <option>031</option>
                    </select> -
                    <input type="text"> - <input type="text">
                </label>
            </div>
            <div>
                <label><span  class="red">성별 : </span>
                <label><input type="radio" name="gender" checked>남자</label>
                <label><input type="radio" name="gender">여자</label>
            </div>
            <div style="margin: 20px;">
                <label>관심언어 : </label>
            </div>
        </div>
    </div>
</body>
</html>
