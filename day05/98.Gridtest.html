<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 16px;
            background-color: #f0f2f5;
        }
        #container > div{
            color: white;
            border-radius: 10px;
            padding: 20px;
            display: flex;
        }

        #container {
            display: grid;
            gap : 10px;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 150px minmax(600px, auto) 150px;
            grid-template-areas:
            "header header"
            "side content"
            "footer footer";
        }

        .header {grid-area: header;}
        .side {grid-area: side;}
        .content {grid-area: content;}
        .footer {grid-area: footer;}

        .header-box {
            background-color: #ff6b6b;
        }

        .side-box {
            background-color: #4ecdc4;
        }
        .content-box {
            background-color: #cccccc;
            flex-wrap: wrap;
            gap: 15px;
            align-content: flex-start;
        }
        .footer-box {
            background-color: #45b7d1;
        }
        .boox{
            background-color: white;
            width: 250px;
            height: 120px;
            border-radius: 10px;
            color: black;
            padding: 20px;
            margin-top: 3px;
        }
        .text1{
            font-weight: bold;
        }
        .text2{
            font-weight: bold;
            margin-top: 40px;
        }
        @media (max-width: 786px) {
            #container {
                grid-template-columns: 1fr;
                grid-template-rows: 150px 120px 1fr 150px;
                grid-template-areas:
                "header"
                "side"
                "content"
                "footer";
            }
            .boox {
                width: 100%;
            } 
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="header header-box">헤더 영역~~</div>
        <div class="side side-box">사이드 영역~~</div>
        <div class="content content-box">
            <div class="boox">
                <div class="text1">위젯 1</div>
                <div class="text2">방문자 수 : 1,234명</div>
            </div>
            <div class="boox">
                <div class="text1">위젯 2</div>
                <div class="text2">매출 : 5,123,120원</div>
            </div>
            <div class="boox">
                <div class="text1">위젯 3</div>
                <div class="text2">신규 가입 : 42명</div>
            </div>
            <div class="boox">
                <div class="text1">위젯 4</div>
                <div class="text2">서버 상태 : 양호</div>
            </div>
            <div class="boox">
                <div class="text1">위젯 5</div>
                <div class="text2">최근 알림이 없습니다.</div>
            </div>
        </div>
        <div class="footer footer-box">하단 영역~~</div>
    </div>
</body>
</html>
